default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit, pre-merge-commit]
      - id: ruff-format
        stages: [pre-commit, pre-merge-commit]
  - repo: local
    hooks:
      - id: sdlc-commit
        name: sdlc commit
        entry: .sdlc/bin/sdlc commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
      - id: sdlc-push
        name: sdlc push
        entry: .sdlc/bin/sdlc push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# Dependabot config for crunchtools container-only repos.
# See constitution.md Section XV.
#
# This repo ships a Containerfile and workflows, with no language-level
# manifest, so the two things that go stale silently are the base image
# pins and the `uses:` action pins.

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # hermes-agent requires Python <3.14 (project.requires-python); the
      # 3.14 base broke the build on 2026-10-02. Lift when upstream allows it.
      - dependency-name: "hummingbird/python"
        versions: [">=3.14"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"

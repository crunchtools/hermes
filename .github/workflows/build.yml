name: Build and Push Hermes

# Triggers (deliberately NO `schedule:`):
#   push   — Containerfile / workflow / config changes
#   workflow_dispatch — manual rebuild
#   repository_dispatch parent-image-updated — fired by Hermes itself when it
#     pulses its own root (Hermes orchestrates a weekly pulse to every root
#     including itself, so the build self-refreshes for CVE pickup).
#
# Profile alignment (autonomous-agent §III): vulnerability scan (Trivy),
# SBOM generation, dual registry push (Quay + GHCR). cosign signing is
# deferred to Phase 4 — production-gate work.

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/hermes
  GHCR_IMAGE: ghcr.io/crunchtools/hermes

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version tag
        id: version
        run: |
          TAG=$(git describe --tags --always 2>/dev/null || echo "v0.1.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image with Buildah
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: hermes
          tags: latest ${{ steps.version.outputs.tag }} ${{ steps.version.outputs.sha_short }}
          containerfiles: ./Containerfile

      - name: Save image for Trivy scan and SBOM
        run: podman save -o /tmp/hermes.tar localhost/hermes:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/hermes.tar
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Generate SBOM (Trivy / SPDX-JSON)
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/hermes.tar
          format: "spdx-json"
          output: "hermes-sbom.spdx.json"
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-sbom-${{ steps.version.outputs.sha_short }}
          path: hermes-sbom.spdx.json
          retention-days: 90

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push to Quay.io
        if: github.event_name != 'pull_request'
        run: |
          podman tag localhost/hermes:latest ${{ env.QUAY_IMAGE }}:latest
          podman tag localhost/hermes:latest ${{ env.QUAY_IMAGE }}:${{ steps.version.outputs.tag }}
          podman push ${{ env.QUAY_IMAGE }}:latest
          podman push ${{ env.QUAY_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          podman tag localhost/hermes:latest ${{ env.GHCR_IMAGE }}:latest
          podman tag localhost/hermes:latest ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}
          podman push ${{ env.GHCR_IMAGE }}:latest
          podman push ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}

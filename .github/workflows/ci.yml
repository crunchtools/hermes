# The entrypoint's own tests and the pin verifier's.
#
# They run the wrapper against a stand-in `hermes` on PATH (tests/stub-hermes),
# so no gateway is ever started here: a second `hermes gateway run` logs in to
# Matrix as the live agent and takes over its identity. Nothing in this
# workflow may change that.
#
# These scripts are here because each decides something that fails quietly
# rather than loudly: tests/verify-pins.py is the only thing that
# notices a pin that did not land under `uv pip install --no-deps`, or a
# shipped version that upstream's own LAZY_DEPS table does not expect; and
# scripts/reconcile-lazy-deps.py edits a cloned third-party file at build
# time, where rewriting too little leaves a platform dead and rewriting too
# much changes pins nobody reviewed.
#
# No pytest. This repo is packaging only, so there is no Python project to
# hang a test runner on; both suites are run directly, one by bash and one by
# python3. `packaging` is the only dependency, and verify-pins.py needs it too.
#
# No `paths:` filter: the tests are cheap and a change anywhere that breaks
# them should fail the pull request.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Entrypoint tests
        run: bash tests/test-entrypoint.sh

  pins:
    name: Pin verifier tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install packaging
        run: python3 -m pip install --quiet --disable-pip-version-check packaging

      - name: Pin verifier tests
        run: python3 tests/test-verify-pins.py

      - name: Lazy-deps reconciler tests
        run: python3 tests/test-reconcile-lazy-deps.py

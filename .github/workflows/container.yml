# Build once, gate the digest, promote what was tested (RT#1550).
#
# All of the logic lives in crunchtools/constitution's container-release.yml.
# A pull request builds and gates its head; the merge promotes that digest to
# :main with no rebuild; a v* tag copies it to the version tags and :latest.
#
# The boot gate runs tests/boot-gate.sh against the pushed digest: the real
# entrypoint must print its `hermes: ready:` line. No other job in this repo
# publishes an image.
#
# repository_dispatch: Hermes pulses every root in its weekly list, itself
# included, so this image self-refreshes for CVE pickup. There is deliberately
# no `schedule:` (org-wide cleanup, see README).
name: Container
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:
permissions: {}
jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.40.0
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/hermes
      boot: command
      boot-command: bash tests/boot-gate.sh "$IMAGE"
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
